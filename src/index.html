<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
  </head>
  <body class="index">
    <header class="header">
      <a href="#header" class="header_logo">
        <svg class="logo__icon" viewBox="0 0 200 200">
          <g>
            <ellipse cx="100" cy="52" rx="24" ry="46"></ellipse>
            <ellipse
              cx="100"
              cy="52"
              rx="24"
              ry="46"
              transform="rotate(72 100 100)"
            ></ellipse>
            <ellipse
              cx="100"
              cy="52"
              rx="24"
              ry="46"
              transform="rotate(144 100 100)"
            ></ellipse>
            <ellipse
              cx="100"
              cy="52"
              rx="24"
              ry="46"
              transform="rotate(216 100 100)"
            ></ellipse>
            <ellipse
              cx="100"
              cy="52"
              rx="24"
              ry="46"
              transform="rotate(288 100 100)"
            ></ellipse>
          </g>
        </svg>
        <span class="logo__text">цветочный</span>
      </a>

      <nav class="header_nav">
        <a class="nav_link" href="#about">О проекте</a>
        <a class="nav_link" href="#articles">Статьи</a>
        <a class="nav_link" href="#form">Форма</a>
      </nav>
    </header>

    <section class="hero section theme theme-light">
      <p class="hero_eyebrow split split-words">
        учебный проект / группа Б25ДЗ10
      </p>

      <h1 class="hero_title">
        <span class="hero_line split-hover">цветоч</span>
        <span class="hero_line">
          <span class="split-hover">ный</span>
          <span class="hero_flower">༘⋆✿</span>
        </span>
      </h1>
    </section>

    <section class="form section theme theme--pink" id="form">
      <div class="section_head">
        <p class="reveal section_label">На связи</p>
        <p class="reveal section_note">без спама, только письмо о запуске</p>
      </div>

      <div class="form_grid">
        <div class="form_intro">
          <h2 class="form_title">Оставайтесь на связи</h2>
          <p class="form_text reveal">
            Напишите нам письмо, как только откроемся, и поделимся первыми
            статьями раньше всех
          </p>
        </div>

        <div class="form_wrapper reveal">
          <form id="my-form">
            <div class="form_field">
              <input
                class="form_input"
                type="text"
                id="message"
                name="message"
                data-fs-field
                placeholder=""
              />
              <label class="form_label" for="message">Как ваз зовут?</label>
              <span data-fs-error="message"></span>
            </div>
            <div class="form_field">
              <input
                class="form_input"
                type="email"
                id="email"
                name="email"
                data-fs-field
                placeholder=""
              />
              <label class="form_label" for="email">Email:</label>
              <span data-fs-error="email"></span>
            </div>

            <button class="form_button button" type="submit" data-fs-submit-btn>
              Отправить <span class="form_flower">༘⋆✿</span>
            </button>
          </form>
        </div>
      </div>
    </section>

      <button type="submit" data-fs-submit-btn>Submit</button>
    </form> -->

    <!-- Place these scripts at the end of the body tag -->
    <script>
      window.formspree =
        window.formspree ||
        function () {
          ;(formspree.q = formspree.q || []).push(arguments)
        }
      formspree('initForm', {
        formElement: '#my-form',
        formId: 'mvkgdbna'
      })
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
